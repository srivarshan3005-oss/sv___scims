# ============================================================
# SCIMS APPLICATION PROPERTIES
# ============================================================

server.port=8080
server.servlet.context-path=/api

spring.application.name=scims-backend

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/scims_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=srivarshan3005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / HIBERNATE
# Schema is managed by sql/schema.sql, not Hibernate auto-ddl.
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Disable Open Session In View — forces explicit @Transactional usage
spring.jpa.open-in-view=false

# ============================================================
# SQL INITIALIZATION
# Spring Boot will run schema.sql and data.sql on startup ONLY
# when spring.sql.init.mode=always. Use 'never' after first run
# to avoid re-seeding. 'schema.sql' must be idempotent (uses
# CREATE TABLE IF NOT EXISTS). 'data.sql' uses INSERT IGNORE.
# ============================================================
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=false
# MySQL dialect requires platform-specific init
spring.sql.init.platform=mysql

# ============================================================
# JWT
# Secret must be >= 32 characters (256-bit minimum for HS256).
# ============================================================
app.jwt.secret=ScimsSecretKey2024SuperSecureBase64EncodedKeyForJWTTokenGeneration
# 24 hours in milliseconds
app.jwt.expiration=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Relative path resolved from the working directory (project root when running via Maven).
app.upload.dir=uploads
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.max-age=3600

# ============================================================
# JSON SERIALIZATION
# Prevents LocalDateTime from serialising as int arrays [2024,1,1].
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# ============================================================
# LOGGING
# ============================================================
logging.level.com.scims=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
